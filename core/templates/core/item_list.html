{% extends 'base.html' %}

{% block title %}
Lista de Items
{% endblock %}

{% block content %}

<h2>Lista de Items</h2>

{% for item in items %}
    <h3>{{ item.name }}</h3>
    <p>{{ item.description }}</p>
    <p>Creado: {{ item.created_at }}</p>
    <hr>
{% empty %}
    <p>No hay items registrados.</p>
{% endfor %}

{% endblock %}
